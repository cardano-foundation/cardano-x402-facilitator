plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.cardanofoundation'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

ext {
    cardanoClientVersion = '0.7.2'
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    runtimeOnly 'org.apache.logging.log4j:log4j-layout-template-json'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation "com.bloxbean.cardano:cardano-client-lib:${cardanoClientVersion}"
    implementation "com.bloxbean.cardano:cardano-client-backend-blockfrost:${cardanoClientVersion}"
    implementation 'com.bloxbean.cardano:aiken-java-binding:0.1.0'
    // CIP-8 / COSE_Sign1 + COSE_Key codec: the seller's authorization over
    // termsDigest is a real signature to verify, not bytes to string-compare.
    implementation "com.bloxbean.cardano:cardano-client-cip8:${cardanoClientVersion}"
    // RFC 8785 JCS. Jackson's key ordering is NOT JCS: it does not canonicalize
    // number formatting or string escaping, so digests would diverge from the
    // TypeScript implementation on values it happens to format differently.
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') { useJUnitPlatform() }

// Black-box devnet suite: drives the facilitator CONTAINER over HTTP against a Yaci
// DevKit devnet. Needs the stack from e2e/run.sh, so nothing (test, check, bootJar)
// depends on it — run it through e2e/run.sh --java.
sourceSets {
    e2eTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    e2eTestCompileOnly 'org.projectlombok:lombok'
    e2eTestAnnotationProcessor 'org.projectlombok:lombok'
    e2eTestImplementation 'com.networknt:json-schema-validator:1.5.1'
}

tasks.register('e2eTest', Test) {
    group = 'verification'
    description = 'Runs the devnet e2e suite against a running stack (use e2e/run.sh --java)'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    useJUnitPlatform {
        // e2e/run.sh runs the outage tests last, in their own invocation.
        if (project.hasProperty('includeTags')) includeTags(*project.property('includeTags').split(','))
        if (project.hasProperty('excludeTags')) excludeTags(*project.property('excludeTags').split(','))
    }
    // The stack, not the sources, decides the outcome: never skip as up-to-date.
    outputs.upToDateWhen { false }
    // e2e/run.sh runs two passes (main, outage); each keeps its own JUnit XML.
    if (project.hasProperty('e2eResultsDir')) {
        reports.junitXml.outputLocation = file(project.property('e2eResultsDir'))
    }
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('interop', JavaExec) {
    group = 'verification'
    description = 'Checks the real Java HTTP endpoints using @x402/cardano and @x402/core 2.26.0 (offline chain)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.cardanofoundation.x402.facilitator.interop.TypeScriptInterop'
}

tasks.register('e2e', JavaExec) {
    group = 'verification'
    description = 'Runs the preprod end-to-end proof (X402PreprodE2E main class)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.cardanofoundation.x402.facilitator.e2e.X402PreprodE2E'
}
