name: E2E (devnet)

# Black-box e2e: build the facilitator image, start it against a Yaci DevKit devnet
# posing as cardano:preview, and drive every route and transfer method with real
# signed transactions — from Java (cardano-client-lib) and from the published
# @x402 TypeScript SDK. Everything runs through e2e/run.sh, which works the same
# way locally. See docs/testing.md#devnet-e2e.
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_IMAGE: x402-facilitator:e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/ts/package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Build facilitator image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.E2E_IMAGE }}
          load: true
          cache-from: type=gha,scope=facilitator
          cache-to: type=gha,mode=max,scope=facilitator

      - name: Build devkit image
        uses: docker/build-push-action@v6
        with:
          context: e2e/devnet
          platforms: linux/amd64
          tags: x402-e2e-devkit:local
          load: true
          cache-from: type=gha,scope=devkit
          cache-to: type=gha,mode=max,scope=devkit

      - name: Devnet e2e (TypeScript SDK, Java suite, then the outage pass)
        run: e2e/run.sh

      - name: Upload test reports and stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          # e2e/.out: junit/{java-main,java-outage,ts.xml}, logs/*, networks.yml
          path: |
            e2e/.out/
            build/reports/tests/e2eTest/
          if-no-files-found: ignore
